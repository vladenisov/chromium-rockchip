name: Build
run-name: ${{ inputs.resume-run && format('Build (resumed from {0})', inputs.resume-run) || 'Build' }}
# Chained build stages; later stages are skipped once one finishes. A tag whose build inputs match
# an earlier build publishes that build's browser instead of compiling again.
on:
  workflow_dispatch:
    inputs:
      resume-run:
        description: Continue from a build tree of this run (empty for a clean build)
        type: string
        default: ''
      resume-tree:
        description: Stage number of the tree artifact to continue from
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      reuse-run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find a reusable build
        id: find
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(sh find-reusable-build.sh)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "Build inputs unchanged: reusing the browser of run $run." >> "$GITHUB_STEP_SUMMARY"
          fi
  stage-1:
    needs: plan
    if: needs.plan.outputs.reuse-run == ''
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      resume-run: ${{ inputs.resume-run || '' }}
      resume-tree: ${{ inputs.resume-tree || '' }}
  stage-2:
    needs: stage-1
    if: needs.stage-1.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
  stage-3:
    needs: stage-2
    if: needs.stage-2.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
  stage-4:
    needs: stage-3
    if: needs.stage-3.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
  stage-5:
    needs: stage-4
    if: needs.stage-4.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5
  stage-6:
    needs: stage-5
    if: needs.stage-5.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 6
  stage-7:
    needs: stage-6
    if: needs.stage-6.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 7
  stage-8:
    needs: stage-7
    if: needs.stage-7.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 8
  stage-9:
    needs: stage-8
    if: needs.stage-8.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 9
  stage-10:
    needs: stage-9
    if: needs.stage-9.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 10
  stage-11:
    needs: stage-10
    if: needs.stage-10.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 11
  stage-12:
    needs: stage-11
    if: needs.stage-11.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 12
  release:
    needs: [plan, stage-1, stage-2, stage-3, stage-4, stage-5, stage-6, stage-7, stage-8, stage-9, stage-10, stage-11, stage-12]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.plan.outputs.reuse-run != '' || contains(join(needs.*.outputs.done, ','), 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: dist
          run-id: ${{ needs.plan.outputs.reuse-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Summary
        run: cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* install.py --repo "$GITHUB_REPOSITORY" \
            --title "Chromium ${GITHUB_REF_NAME#v} for RK3588" --prerelease \
            --notes-file .github/release-notes.md
      - name: Delete build trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("tree-")) | .id' |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
